services:
  postgres:
    image: postgres
    container_name: db
    restart: always
    user: postgres
    volumes:
      - ./db-data:/var/lib/postgresql
    env_file:
      - .env.dev
    environment:
      - POSTGRES_DB=hono
      - POSTGRES_PASSWORD=mysecretpassword
      - POSTGRES_USER=postgres
    ports:
      - 5432:5432
    expose:
      - 5432
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    restart: always
    env_file:
      - .env.dev
    ports:
      - "8888:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: db@mail.db
      PGADMIN_DEFAULT_PASSWORD: root
    volumes:
      - ./pgadmin:/var/lib/pgadmin
