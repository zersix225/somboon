services:
  frontend:
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile
    ports:
      - 3001:3000
    env_file:
      - .env.production
    environment:
      - NODE_ENV=production
    depends_on:
      - backend

  backend:
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile
    ports:
      - 3000:3000
    env_file:
      - .env.production
    environment:
      - NODE_ENV=production

  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - "minio_data:/bitnami/minio/data"
    environment:
      - MINIO_ROOT_USER=user
      - MINIO_ROOT_PASSWORD=mysecretpassword
      - MINIO_DEFAULT_BUCKETS=mybucket
    command: server --address ":9001" --console-address ":9000" /data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 30s
    restart: unless-stopped

volumes:
  minio_data:
